<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>평안호</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed 3D sea scene; frosted panels pinned to the corners, chat along the bottom edge.
   Deliberately single-look (dusk glass over a live scene), so colors are fixed rather than themed. */
:root{
  --ink:#fbf4e8;
  --ink-dim:rgba(251,244,232,.66);
  --glass:rgba(13,19,34,.44);
  --glass-strong:rgba(13,19,34,.74);
  --line:rgba(255,255,255,.15);
  --accent:#f2b36f;
  --accent-ink:#2b1a0b;
  --f-display:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#0d1424;color:var(--ink);font-family:var(--f-body);font-size:14px;-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:14px}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none}
.seatbar,.toast{pointer-events:auto}
.top{position:absolute;top:calc(12px + var(--st));left:max(16px,var(--sl));right:max(16px,var(--sr));display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
.top > *{pointer-events:auto}
.crew{padding:10px 14px 10px;min-width:0;max-width:260px}
.ship{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ship-name{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em}
.pill{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.pill::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#8a93a6;margin-right:6px;vertical-align:1px}
.pill.on::before{background:#7fe0b0;box-shadow:0 0 8px #7fe0b0}
.pill.solo::before{background:var(--accent)}
#crew{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;max-height:40vh;overflow:auto}
#crew li{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
#crew .dot{flex:none;width:10px;height:10px;border-radius:50%;border:1px solid rgba(255,255,255,.5)}
#crew .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#crew .st{color:var(--ink-dim);font-size:11.5px;white-space:nowrap;margin-left:auto}
#crew .me{color:var(--accent);font-size:11px}

.tools{display:flex;align-items:center;gap:6px;padding:6px;position:relative}
.seg{display:flex;background:rgba(0,0,0,.22);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:8px;font-size:13px;color:var(--ink-dim)}
.seg button.on{background:var(--ink);color:#1b2234}
.icon{border:0;background:transparent;width:34px;height:32px;border-radius:9px;font-size:16px;display:grid;place-items:center}
.icon:hover,.icon[aria-expanded="true"]{background:rgba(255,255,255,.12)}
.pop{position:absolute;top:calc(100% + 8px);right:0;width:220px;padding:12px 14px;display:grid;gap:10px;background:var(--glass-strong)}
.pop label{display:grid;gap:4px;font-size:12px;color:var(--ink-dim)}
.pop input[type=range]{width:100%;accent-color:var(--accent)}

.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(70px + var(--st));padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;color:var(--ink-dim);white-space:nowrap;transition:opacity .8s;pointer-events:none}
.hint.fade{opacity:0}

.seatbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(132px + var(--sb));display:flex;gap:8px}
.seatbar button{border:1px solid var(--line);background:var(--glass-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:9px 16px;border-radius:999px;font-size:13.5px}
.seatbar button.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}

.bottom{position:absolute;left:max(16px,var(--sl));right:max(16px,var(--sr));bottom:calc(14px + var(--sb));display:flex;flex-direction:column;align-items:flex-start;gap:8px;pointer-events:none}
.bottom > *{pointer-events:auto}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-width:min(460px,100%);pointer-events:none}
#log li{background:rgba(10,15,28,.5);border-radius:10px;padding:5px 10px;font-size:13px;line-height:1.45;overflow-wrap:anywhere;transition:opacity 1.2s;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#log li.old{opacity:.38}
#log li.sys{background:transparent;color:var(--ink-dim);font-size:12px;padding:2px 10px}
#log b{font-weight:600;margin-right:6px}
.chatbar{display:flex;align-items:center;gap:6px;padding:6px;width:min(560px,100%)}
.emotes{display:flex;gap:2px}
.emotes button{border:0;background:transparent;width:34px;height:34px;border-radius:9px;font-size:18px}
.emotes button:hover{background:rgba(255,255,255,.12)}
#chatForm{display:flex;flex:1;min-width:0;gap:6px}
#chatInput{flex:1;min-width:0;border:1px solid transparent;background:rgba(0,0,0,.25);border-radius:9px;padding:8px 11px;outline:none}
#chatInput:focus{border-color:rgba(242,179,111,.6)}
#chatInput::placeholder{color:rgba(251,244,232,.45)}
#chatForm button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 14px;font-weight:600}

.toast{position:absolute;left:50%;top:calc(112px + var(--st));transform:translateX(-50%);background:var(--glass-strong);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;white-space:nowrap}

body.zen .top .crew, body.zen .seg, body.zen .bottom, body.zen .hint, body.zen .seatbar{opacity:0;pointer-events:none}
body.zen .top .crew, body.zen .seg, body.zen .bottom, body.zen .seatbar{transition:opacity .6s}

/* ---------- Entry ---------- */
#entry{position:fixed;inset:0;display:grid;place-items:center;padding:calc(20px + var(--st)) max(16px,var(--sr)) calc(20px + var(--sb)) max(16px,var(--sl));background:linear-gradient(180deg,rgba(10,14,30,.05) 0%,rgba(10,14,30,.55) 100%);transition:opacity 1.2s ease}
#entry.gone{opacity:0;pointer-events:none}
.card{width:min(400px,100%);padding:26px 24px 22px;background:var(--glass-strong);display:grid;gap:12px;border-radius:20px;max-height:100%;overflow:auto}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;color:var(--accent)}
.card h1{margin:-4px 0 0;font-family:var(--f-display);font-weight:700;font-size:40px;letter-spacing:.04em;line-height:1.1;text-wrap:balance}
.lede{margin:0;color:var(--ink-dim);line-height:1.6;font-size:13.5px}
.field{display:grid;gap:6px}
.field > span{font-size:12px;color:var(--ink-dim)}
#nick{border:1px solid var(--line);background:rgba(0,0,0,.28);border-radius:10px;padding:10px 12px;outline:none;font-size:15px}
#nick:focus{border-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:transform .15s}
.swatches input:checked + span{border-color:var(--ink);transform:scale(1.12);box-shadow:0 0 0 3px rgba(242,179,111,.45)}
.swatches input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.gender{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gender label{position:relative;cursor:pointer}
.gender input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.gender span{display:block;text-align:center;padding:9px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.22);font-size:14px}
.gender input:checked + span{background:var(--ink);color:#1b2234;border-color:transparent}
.gender input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.reroll{border:0;background:transparent;color:var(--accent);font-size:12px;padding:0 0 0 8px}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.check input{accent-color:var(--accent);width:16px;height:16px}
.primary-btn{margin-top:4px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;border-radius:12px;padding:13px;letter-spacing:.04em}
.primary-btn:disabled{opacity:.5;cursor:not-allowed}
.status{margin:0;font-size:12.5px;color:var(--ink-dim);text-align:center;font-variant-numeric:tabular-nums}

@media (max-width:640px){
  .crew{max-width:52vw;padding:8px 11px}
  .ship-name{font-size:16px}
  #crew{max-height:22vh}
  .seg button{padding:6px 8px}
  .hint{top:auto;bottom:calc(132px + var(--sb));white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px)}
  .seatbar{bottom:calc(128px + var(--sb))}
  .chatbar{flex-wrap:wrap}
  .emotes{width:100%;justify-content:space-around}
  #log{max-width:100%}
  #log li:nth-last-child(n+4){display:none}
}
@media (prefers-reduced-motion:reduce){ #entry,.hint,#log li{transition:none} }
</style>
</head>
<body>
<canvas id="c" aria-label="바다 위 요트 3D 공간"></canvas>

<div id="hud" hidden>
  <header class="top">
    <div class="panel crew">
      <div class="ship"><span class="ship-name">평안호</span><span id="conn" class="pill">연결 중…</span></div>
      <ul id="crew"></ul>
    </div>
    <div class="panel tools">
      <div class="seg" role="group" aria-label="시간대">
        <button type="button" data-tod="day">낮</button>
        <button type="button" data-tod="sunset">노을</button>
        <button type="button" data-tod="night" class="on">밤</button>
      </div>
      <button type="button" id="soundBtn" class="icon" aria-expanded="false" aria-controls="soundPop" title="소리">♪</button>
      <button type="button" id="zenBtn" class="icon" title="화면 정리 (H)" aria-pressed="false">◐</button>
      <div id="soundPop" class="panel pop" hidden>
        <label for="volMusic">피아노<input id="volMusic" type="range" min="0" max="100" value="90"></label>
        <label for="volWaves">파도 소리<input id="volWaves" type="range" min="0" max="100" value="60"></label>
      </div>
    </div>
  </header>

  <div id="hint" class="hint">갑판을 눌러 걷고, 선베드를 눌러 누워 보세요 · 드래그로 시점 회전</div>

  <div id="seatbar" class="seatbar" hidden>
    <button type="button" id="viewBtn">바다 바라보기</button>
    <button type="button" id="standBtn" class="primary">일어나기</button>
  </div>

  <footer class="bottom">
    <ol id="log" aria-live="polite"></ol>
    <div class="panel chatbar">
      <div class="emotes" role="group" aria-label="감정 표현">
        <button type="button" data-emo="wave" title="손 흔들기">👋</button>
        <button type="button" data-emo="cheers" title="건배">🥂</button>
        <button type="button" data-emo="heart" title="좋아요">💛</button>
        <button type="button" data-emo="relax" title="편안해요">😌</button>
        <button type="button" data-emo="sun" title="노을 최고">🌅</button>
      </div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" maxlength="80" placeholder="바닷바람에 한마디… (Enter)" aria-label="채팅 메시지">
        <button type="submit">보내기</button>
      </form>
    </div>
  </footer>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

<div id="entry">
  <form class="card" id="entryForm">
    <p class="eyebrow">바다 한가운데의 작은 쉼터</p>
    <h1>평안호</h1>
    <p class="lede">파라솔 아래 선베드에 누워 수평선을 바라보세요. 잔잔한 피아노와 파도 소리가 함께합니다. 1층 14자리, 2층 선데크 6자리 — 최대 20명이 함께 승선할 수 있어요.</p>
    <label class="field" for="nick"><span>가명 <button type="button" id="reroll" class="reroll" title="다른 가명 뽑기">↻ 다른 이름</button></span><input id="nick" maxlength="12" placeholder="갑판에서 불릴 가명" required></label>
    <div class="field"><span>캐릭터</span>
      <div class="gender" role="radiogroup" aria-label="캐릭터 성별">
        <label for="g-m"><input type="radio" name="gender" id="g-m" value="m"><span>남자</span></label>
        <label for="g-f"><input type="radio" name="gender" id="g-f" value="f"><span>여자</span></label>
      </div>
    </div>
    <div class="field"><span>셔츠 색</span><div class="swatches" id="shirts" role="radiogroup" aria-label="셔츠 색"></div></div>
    <div class="field"><span>피부 톤</span><div class="swatches" id="skins" role="radiogroup" aria-label="피부 톤"></div></div>
    <label class="check" for="hat"><input id="hat" type="checkbox" checked> 밀짚모자 쓰기</label>
    <button class="primary-btn" id="enterBtn" type="submit">승선하기</button>
    <p class="status" id="entryStatus">다른 승객을 찾는 중…</p>
  </form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const angDiff = (a,b) => { let d = (b-a) % (Math.PI*2); if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2; return d; };
const r2 = v => Math.round(v*100)/100;
const MAX_PEOPLE = 20;
const S = 4;            // yacht scale (hull, deck, salon); people and furniture stay life-size
const DECK_Y = 2.4;
const SHIRTS = ['#e86a5c','#f2b84b','#5fb3a1','#4f7fd9','#9a7be0','#f3eee2','#2f3b52','#e98bb0'];
const SKINS = ['#f6d9c2','#e9bb92','#c68b5e','#8b5b3c'];
const NICK_A = ['느긋한','졸린','반짝이는','수줍은','행복한','여유로운','말랑한','포근한','나른한','설레는'];
const NICK_B = ['갈매기','돌고래','해파리','소라','산호','물개','펭귄','고래','불가사리','거북이'];
const randomNick = () => `${pick(NICK_A)} ${pick(NICK_B)}`.slice(0, 12);
const EMOJI = { wave:'👋', cheers:'🥂', heart:'💛', relax:'😌', sun:'🌅' };

/* ================= Renderer & scene ================= */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffffff, 90, 1500);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 3000);

/* ================= Time of day ================= */
const TOD = {
  day:    { sun:[0.45,0.70,0.55], top:'#3a7ccc', hor:'#cde5f1', hor2:'#b5d3e8', sunC:'#fff1d6', deep:'#08456e', shal:'#2a86ad', disc:1.0, glow:0.5, sunI:1.4, light:2.1, hemiS:'#d7ebff', hemiG:'#3a5a6e', hemiI:0.85, stars:0, lamps:0, cloud:'#ffffff', cloudO:0.92, gull:'#f0f0ee' },
  sunset: { sun:[0.22,0.075,1.0], top:'#26386e', hor:'#ff9364', hor2:'#b9809a', sunC:'#ffc07a', deep:'#132846', shal:'#3c4e70', disc:1.0, glow:1.0, sunI:1.5, light:1.6, hemiS:'#ffb894', hemiG:'#2c2e4a', hemiI:0.72, stars:0.05, lamps:0.6, cloud:'#ffae88', cloudO:0.85, gull:'#2b2a3a' },
  night:  { sun:[-0.35,0.30,0.88], top:'#02050e', hor:'#15203f', hor2:'#0d1630', sunC:'#d5deff', deep:'#020711', shal:'#0a1530', disc:0.75, glow:0.22, sunI:0.7, light:0.32, hemiS:'#3e4f80', hemiG:'#05070d', hemiI:0.45, stars:1, lamps:1, cloud:'#262f4d', cloudO:0.55, gull:'#1a1d2b' }
};
function toEnv(p){
  return { sun:new THREE.Vector3(...p.sun).normalize(), top:new THREE.Color(p.top), hor:new THREE.Color(p.hor), hor2:new THREE.Color(p.hor2), sunC:new THREE.Color(p.sunC),
    deep:new THREE.Color(p.deep), shal:new THREE.Color(p.shal), hemiS:new THREE.Color(p.hemiS), hemiG:new THREE.Color(p.hemiG), cloud:new THREE.Color(p.cloud), gull:new THREE.Color(p.gull),
    disc:p.disc, glow:p.glow, sunI:p.sunI, light:p.light, hemiI:p.hemiI, stars:p.stars, lamps:p.lamps, cloudO:p.cloudO };
}
const ENVS = { day:toEnv(TOD.day), sunset:toEnv(TOD.sunset), night:toEnv(TOD.night) };
let envTarget = ENVS.night;
const env = toEnv(TOD.night);
const COLOR_KEYS = ['top','hor','hor2','sunC','deep','shal','hemiS','hemiG','cloud','gull'];
const NUM_KEYS = ['disc','glow','sunI','light','hemiI','stars','lamps','cloudO'];

const U = {
  time:{value:0}, sunDir:{value:env.sun.clone()}, topC:{value:env.top.clone()}, horC:{value:env.hor.clone()}, horC2:{value:env.hor2.clone()},
  sunC:{value:env.sunC.clone()}, disc:{value:1}, glow:{value:1}, deepC:{value:env.deep.clone()}, shalC:{value:env.shal.clone()}, sunI:{value:1}
};
const SKY_GLSL = `
uniform vec3 sunDir; uniform vec3 topC; uniform vec3 horC; uniform vec3 horC2; uniform vec3 sunC; uniform float disc; uniform float glow;
vec3 skyCol(vec3 d){
  float h = d.y;
  vec2 hz = normalize(d.xz + vec2(1e-5));
  vec2 sz = normalize(sunDir.xz + vec2(1e-5));
  float az = dot(hz, sz)*0.5 + 0.5;
  vec3 hc = mix(horC2, horC, pow(az, 1.6));
  vec3 c = mix(hc, topC, pow(clamp(h, 0.0, 1.0), 0.42));
  if (h < 0.0) c = mix(hc, hc*0.6 + topC*0.25, clamp(-h*5.0, 0.0, 1.0));
  float sd = max(dot(d, sunDir), 0.0);
  c += sunC * glow * (pow(sd, 5.0)*0.28 + pow(sd, 48.0)*0.45);
  c += sunC * disc * smoothstep(0.99935, 0.99975, sd) * 2.2;
  return c;
}`;

/* Sky dome */
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 40, 20), new THREE.ShaderMaterial({
  uniforms: U, side: THREE.BackSide, depthWrite: false, fog: false, toneMapped: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: SKY_GLSL + `varying vec3 vDir; void main(){ gl_FragColor = vec4(skyCol(normalize(vDir)), 1.0); }`
}));
sky.renderOrder = -10; sky.frustumCulled = false;
scene.add(sky);

/* Stars */
const stars = (() => {
  const n = 1400, pos = new Float32Array(n*3);
  for (let i = 0; i < n; i++) {
    const u = Math.random()*Math.PI*2, v = rand(0.06, 1);
    const r = 950, y = Math.pow(v, 0.8);
    const s = Math.sqrt(1 - y*y);
    pos[i*3] = Math.cos(u)*s*r; pos[i*3+1] = y*r; pos[i*3+2] = Math.sin(u)*s*r;
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

const ocean = (() => {
  const R = 150, S = 180, maxR = 2600, pos = [0,0,0], idx = [];
  for (let i = 1; i <= R; i++) {
    const r = maxR * Math.pow(i/R, 2.4);
    for (let j = 0; j < S; j++) { const a = j/S*Math.PI*2; pos.push(Math.cos(a)*r, 0, Math.sin(a)*r); }
  }
  for (let j = 0; j < S; j++) idx.push(0, 1 + (j+1)%S, 1 + j);
  for (let i = 1; i < R; i++) {
    const a0 = 1 + (i-1)*S, a1 = 1 + i*S;
    for (let j = 0; j < S; j++) { const j1 = (j+1)%S; idx.push(a0+j, a0+j1, a1+j, a0+j1, a1+j1, a1+j); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    uniforms: U, toneMapped: false, fog: false, side: THREE.DoubleSide,
    vertexShader: `
      uniform float time; varying vec3 vW; varying vec3 vN;
      void main(){
        vec4 w = modelMatrix * vec4(position, 1.0);
        float h = 0.0; vec2 grad = vec2(0.0);
        #define WV(dx,dz,a,k,s) { vec2 d = normalize(vec2(dx,dz)); float ph = dot(d, w.xz)*k + time*s; h += a*sin(ph); grad += a*k*cos(ph)*d; }
        WV(1.0, 0.3, 0.24, 0.16, 1.25)
        WV(-0.4, 1.0, 0.12, 0.37, 1.9)
        WV(0.7, -0.8, 0.06, 0.74, 2.7)
        WV(-0.9, -0.25, 0.035, 1.35, 3.6)
        float att = 1.0 - smoothstep(180.0, 700.0, length(w.xz - cameraPosition.xz));
        h *= att; grad *= att;
        w.y += h;
        vW = w.xyz; vN = normalize(vec3(-grad.x, 1.0, -grad.y));
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: SKY_GLSL + `
      uniform float time; uniform vec3 deepC; uniform vec3 shalC; uniform float sunI;
      varying vec3 vW; varying vec3 vN;
      void main(){
        float dist = length(vW - cameraPosition);
        float rf = 1.0 - smoothstep(25.0, 260.0, dist);
        float r1 = sin(vW.x*2.1 + time*2.3) * sin(vW.z*1.7 - time*1.9);
        float r2 = sin(vW.x*4.7 - vW.z*3.1 + time*3.7);
        float r3 = sin(vW.x*9.3 + vW.z*7.1 - time*5.3);
        vec3 n = normalize(normalize(vN) + vec3(r1*0.07 + r2*0.035 + r3*0.015, 0.0, r2*0.05 + r1*0.025 - r3*0.015) * rf);
        vec3 v = normalize(cameraPosition - vW);
        float nv = max(dot(n, v), 0.0);
        float fres = clamp(0.02 + 0.98*pow(1.0 - nv, 5.0), 0.0, 1.0);
        vec3 r = reflect(-v, n); r.y = abs(r.y);
        vec3 refl = skyCol(r);
        vec3 body = mix(deepC, shalC, clamp(0.35 - r1*0.1 + (1.0 - nv)*0.35, 0.0, 1.0));
        vec3 col = mix(body, refl, fres*0.92);
        float sd = max(dot(r, sunDir), 0.0);
        col += sunC * sunI * (pow(sd, 900.0)*5.0 + pow(sd, 90.0)*0.35 + pow(sd, 12.0)*0.04);
        vec3 horz = skyCol(normalize(vec3(-v.x, 0.002, -v.z)));
        col = mix(col, horz, smoothstep(120.0, 1000.0, dist));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const o = new THREE.Mesh(g, m); o.frustumCulled = false; o.renderOrder = -5; scene.add(o); return o;
})();

}

/* ================= Movement helpers ================= */
// Levels: 0 = lower deck, 1 = upper sun deck, 2 = on the staircase between them.
function pushOut(x, z, list){
  for (const b of list) {
    const x0 = b.x0 - 0.18, x1 = b.x1 + 0.18, z0 = b.z0 - 0.18, z1 = b.z1 + 0.18;
    if (x > x0 && x < x1 && z > z0 && z < z1) {
      const dl = x - x0, dr = x1 - x, dtp = z - z0, db = z1 - z, m = Math.min(dl, dr, dtp, db);
      if (m === dl) x = x0; else if (m === dr) x = x1; else if (m === dtp) z = z0; else z = z1;
    }
  }
  return [x, z];
}
function clamp0(x, z){
  z = clamp(z, -10.6*S, STERN - 0.4);
  const hw = Math.max(0.2, halfW(z) - 0.38);
  return pushOut(clamp(x, -hw, hw), z, OBST);
}
function clamp1(x, z){ return pushOut(clamp(x, -UPD.x, UPD.x), clamp(z, UPD.z0, UPD.z1), OBST1); }
function clampWalk(x, z, l = 0){ return l === 1 ? clamp1(x, z) : clamp0(x, z); }
// one step from (x,z,l) toward (nx,nz); returns [x, z, l]
function stepTo(x, z, l, nx, nz){
  if (l === 0 && Math.abs(nx) < ST.x && nz < ST.zBot + 0.25 && z >= ST.zBot - 0.05) { l = 2; nz = Math.min(nz, ST.zBot - 0.01); }
  else if (l === 1 && Math.abs(nx) < ST.x && nz > UPD.z1 - 0.05) { l = 2; nz = Math.max(nz, ST.zTop + 0.01); }
  if (l === 2) {
    nx = clamp(nx, -ST.x*0.9, ST.x*0.9);
    if (nz >= ST.zBot) return [nx, ST.zBot + 0.22, 0];
    if (nz <= ST.zTop) return [nx, ST.zTop - 0.2, 1];
    return [nx, nz, 2];
  }
  const [cx, cz] = clampWalk(nx, nz, l);
  return [cx, cz, l];
}
function segHitsSalon(a, b){
  for (let i = 1; i < 30; i++) { const t = i/30, x = lerp(a.x, b.x, t), z = lerp(a.z, b.z, t); if (Math.abs(x) < SAL.x + 0.3 && z > SAL.z0 - 0.3 && z < SAL.z1 + 0.3) return true; }
  return false;
}
// lower-deck route that walks around the salon instead of into it
function route0(a, b){
  if (!segHitsSalon(a, b)) return [b];
  const side = p => (Math.abs(p.x) > SAL.x ? Math.sign(p.x) : 0);
  const region = p => p.z > SAL.z1 ? 'A' : p.z < SAL.z0 ? 'F' : 'S';
  const X = s => s*(SAL.x + 1.6), zA = SAL.z1 + 1.6, zF = SAL.z0 - 1.6;
  const ra = region(a), rb = region(b);
  let s = side(a) || side(b) || (b.x >= 0 ? 1 : -1);
  const pts = [];
  if (ra === 'S' && rb === 'S') pts.push({ x: X(side(a) || 1), z: zA }, { x: X(side(b) || 1), z: zA });
  else {
    if (ra !== 'S') { const sa = rb === 'S' ? (side(b) || s) : s; pts.push({ x: X(sa), z: ra === 'A' ? zA : zF }); s = sa; }
    if (rb !== 'S') { const sb = ra === 'S' ? (side(a) || s) : s; pts.push({ x: X(sb), z: rb === 'A' ? zA : zF }); }
  }
  pts.push(b);
  return pts;
}
const STAIR_BOT = { x: 0, z: ST.zBot + 0.8 }, STAIR_TOP = { x: 0, z: ST.zTop - 0.8 };
function planPath(tx, tz, tl){
  let cur = { x: me.x, z: me.z }, l = me.l, path = [];
  if (l === 2) { const p = tl === 1 ? STAIR_TOP : STAIR_BOT; path.push(p); cur = p; l = tl === 1 ? 1 : 0; }
  const t = { x: tx, z: tz };
  if (l === 0 && tl === 0) path = path.concat(route0(cur, t));
  else if (l === 0 && tl === 1) path = path.concat(route0(cur, STAIR_BOT), [STAIR_TOP, t]);
  else if (l === 1 && tl === 1) path.push(t);
  else path = path.concat([STAIR_TOP, STAIR_BOT], route0(STAIR_BOT, t));
  me.path = path; me.stuck = 0;
}
function seatPose(i){
  const L = LOUNGERS[i];
  return { x: L.x, z: L.z, ry: L.ry, l: L.l };
}

const cam = { yaw: 0.7, pitch: 0.32, dist: 100, tYaw: 0.7, tPitch: 0.32, tDist: 100, focus: new THREE.Vector3(0, 4, 0), userTouched: false };
const tmpV = new THREE.Vector3(), lookV = new THREE.Vector3(), focusT = new THREE.Vector3(), probeV = new THREE.Vector3();
const camLocal = new THREE.Vector3();
const BLOCK = { x: SAL.x + 0.3, z0: SAL.z0 - 0.3, z1: SAL.z1 + 0.3, y0: DECK_Y, y1: UP_Y + 0.05 };
function seaView(){
  if (me.seat < 0) return;
  const ry = LOUNGERS[me.seat].ry;
  cam.tYaw = cam.yaw + angDiff(cam.yaw, ry + Math.PI);
  cam.tPitch = 0.22; cam.tDist = 3.4;
}
function updateCamera(dt){
  const k = 1 - Math.exp(-dt*5);
  if (!entered) { cam.tYaw += dt*0.04; }
  cam.yaw = lerp(cam.yaw, cam.tYaw, k);
  cam.pitch = lerp(cam.pitch, cam.tPitch, k);
  cam.dist = lerp(cam.dist, cam.tDist, k);
  if (!entered) focusT.set(0, 5, -2);
  else if (me.seat >= 0) {
    const L = LOUNGERS[me.seat]; const fx = Math.sin(L.ry), fz = Math.cos(L.ry);
    focusT.set(L.x + fx*1.6, levelY(L.l) + 0.9, L.z + fz*1.6);
  } else focusT.set(me.x, levelY(me.l, me.z) + 0.9, me.z);
  cam.focus.lerp(focusT, 1 - Math.exp(-dt*7));
  const cp = Math.cos(cam.pitch);
  tmpV.set(Math.sin(cam.yaw)*cp, Math.sin(cam.pitch), Math.cos(cam.yaw)*cp).multiplyScalar(cam.dist).add(cam.focus);
  // keep the salon block from coming between the camera and the player
  if (entered) for (let i = 1; i <= 40; i++) {
    probeV.lerpVectors(cam.focus, tmpV, i/40);
    if (Math.abs(probeV.x) < BLOCK.x && probeV.z > BLOCK.z0 && probeV.z < BLOCK.z1 && probeV.y > BLOCK.y0 && probeV.y < BLOCK.y1) {
      tmpV.lerpVectors(cam.focus, tmpV, Math.max(0.1, (i - 1.5)/40)); break;
    }
  }
  camera.position.copy(yacht.localToWorld(tmpV));
  camera.position.y = Math.max(camera.position.y, 0.7);
  camera.lookAt(yacht.localToWorld(lookV.copy(cam.focus)));
}

/* Pointer controls */
const pointers = new Map();
let dragMoved = 0, pinchStart = 0, pinchDist = 0;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 1) dragMoved = 0;
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchStart = Math.hypot(a.x-b.x, a.y-b.y); pinchDist = cam.tDist; dragMoved = 99; }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (dragMoved > 6) { cam.tYaw -= dx*0.006; cam.tPitch = clamp(cam.tPitch + dy*0.004, 0.03, 1.3); cam.userTouched = true; }
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y);
    if (pinchStart > 0) cam.tDist = clamp(pinchDist*pinchStart/d, 1.6, 120);
  }
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  const single = pointers.size === 1;
  pointers.delete(e.pointerId);
  if (single && dragMoved <= 6 && e.type === 'pointerup') onTap(e.clientX, e.clientY);
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', e => { e.preventDefault(); cam.tDist = clamp(cam.tDist*(1 + e.deltaY*0.0012), 1.6, 120); }, { passive: false });

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const marker = (() => {
  const m = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.22, 28), new THREE.MeshBasicMaterial({ color: 0xfff3dd, transparent: true, opacity: 0, depthWrite: false }));
  m.rotation.x = -Math.PI/2; yacht.add(m); return m;
})();
function showMarker(x, y, z){ marker.position.set(x, y, z); marker.material.opacity = 0.9; }
function onTap(cx, cy){
  if (!entered) return;
  const r = canvas.getBoundingClientRect();
  ndc.set(((cx - r.left)/r.width)*2 - 1, -((cy - r.top)/r.height)*2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects([deck, upperDeck, stairs, ...loungerGroups], true);
  for (const h of hits) {
    let o = h.object; while (o && !o.userData.kind) o = o.parent;
    if (!o) continue;
    const kind = o.userData.kind;
    if (kind === 'lounger') { tryLounger(o.userData.idx); return; }
    if (kind === 'deck' || kind === 'deck1' || kind === 'stairs') {
      const p = yacht.worldToLocal(h.point.clone());
      let tl = kind === 'deck1' ? 1 : 0, tx = p.x, tz = p.z;
      if (kind === 'stairs') { tl = 1; tx = STAIR_TOP.x; tz = STAIR_TOP.z; }
      [tx, tz] = clampWalk(tx, tz, tl);
      if (me.seat >= 0) standUp();
      me.pendingSeat = -1; planPath(tx, tz, tl);
      showMarker(tx, levelY(tl) + 0.02, tz);
      return;
    }
  }
}
function occupant(i){
  for (const r of remotes.values()) if (r.seat === i) return r;
  return null;
}
function besideLounger(i){
  const L = LOUNGERS[i];
  const side = i % 2 === 0 ? -1 : 1;   // step out on the side away from the paired lounger
  return clampWalk(L.x + side*0.75, L.z, L.l);
}
function tryLounger(i){
  if (me.seat === i) { seaView(); return; }
  const occ = occupant(i);
  if (occ) { toast(`${occ.look.n}님이 쉬고 있는 선베드예요`); return; }
  if (me.seat >= 0) standUp();
  const L = LOUNGERS[i];
  const [x, z] = besideLounger(i);
  me.pendingSeat = i; planPath(x, z, L.l);
  showMarker(L.x, levelY(L.l) + 0.45, L.z);
}
function sit(i){
  if (occupant(i)) { toast('방금 다른 분이 먼저 누웠어요'); return; }
  me.seat = i; me.pendingSeat = -1; me.path = [];
  const p = seatPose(i); me.x = p.x; me.z = p.z; me.ry = p.ry; me.l = p.l;
  seaView();
  $('#seatbar').hidden = false;
  fadeHint(); renderCrew();
}
function standUp(){
  if (me.seat < 0) return;
  const L = LOUNGERS[me.seat];
  const [x, z] = besideLounger(me.seat);
  me.x = x; me.z = z; me.l = L.l; me.seat = -1;

}
function nearestFreeLounger(){
  let best = -1, bd = 3.2;
  LOUNGERS.forEach((L, i) => { if (L.l !== me.l) return; const d = Math.hypot(L.x - me.x, L.z - me.z); if (d < bd && !occupant(i)) { bd = d; best = i; } });
  return best;
}

const keys = {};
window.addEventListener('keydown', e => {
  const typing = document.activeElement && (document.activeElement.tagName === 'INPUT');
  if (typing) { if (e.key === 'Escape') document.activeElement.blur(); return; }
  if (!entered) return;
  if (e.key === 'Enter') { e.preventDefault(); $('#chatInput').focus(); return; }
  if (e.code === 'KeyH') { toggleZen(); return; }
  if (e.code === 'KeyE') { if (me.seat >= 0) standUp(); else { const i = nearestFreeLounger(); if (i >= 0) tryLounger(i); } return; }
  if (e.code.startsWith('Digit')) { const n = +e.code.slice(5); const ids = Object.keys(EMOJI); if (ids[n-1]) doEmote(ids[n-1]); return; }
  keys[e.code] = true;
});

const WALK = 4.0;
function updateMe(dt){
  let mx = 0, mz = 0;
  if (keys.KeyW || keys.ArrowUp) mz += 1;
  if (keys.KeyS || keys.ArrowDown) mz -= 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  let moving = false;
  const px = me.x, pz = me.z;
  if (mx || mz) {
    if (me.seat >= 0) standUp();
    me.path = []; me.pendingSeat = -1;
    const fx = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
    const rx = -fz, rz = fx;
    let dx = fx*mz + rx*mx, dz = fz*mz + rz*mx; const l = Math.hypot(dx, dz); dx /= l; dz /= l;
    [me.x, me.z, me.l] = stepTo(me.x, me.z, me.l, me.x + dx*WALK*dt, me.z + dz*WALK*dt);
    me.ry = me.ry + angDiff(me.ry, Math.atan2(dx, dz))*Math.min(1, dt*12);
    moving = true;
  } else if (me.path.length && me.seat < 0) {
    const tgt = me.path[0];
    const dx = tgt.x - me.x, dz = tgt.z - me.z, d = Math.hypot(dx, dz);
    if (d < 0.12) {
      me.path.shift();
      if (!me.path.length && me.pendingSeat >= 0) sit(me.pendingSeat);
    } else {
      const st = Math.min(d, WALK*dt);
      const [nx, nz, nl] = stepTo(me.x, me.z, me.l, me.x + dx/d*st, me.z + dz/d*st);
      if (Math.hypot(nx - me.x, nz - me.z) < st*0.25 && nl === me.l) {
        if ((me.stuck += dt) > 0.5) {
          const L = me.pendingSeat >= 0 ? LOUNGERS[me.pendingSeat] : null;
          me.path = [];
          if (L && L.l === me.l && Math.hypot(L.x - me.x, L.z - me.z) < 1.8) sit(me.pendingSeat); else me.pendingSeat = -1;
        }
      } else me.stuck = 0;
      me.x = nx; me.z = nz; me.l = nl;
      me.ry = me.ry + angDiff(me.ry, Math.atan2(dx, dz))*Math.min(1, dt*10);
      moving = true;
    }
  }
  if (!myAvatar) return;
  const sp = Math.hypot(me.x - px, me.z - pz)/Math.max(dt, 1e-3);
  myAvatar.speed = lerp(myAvatar.speed, moving ? sp : 0, 0.3);
  myAvatar.root.position.set(me.x, levelY(me.l, me.z), me.z);
  myAvatar.root.rotation.y = me.ry;
  if (moving && !cam.userTouched) cam.tYaw = cam.tYaw + angDiff(cam.tYaw, me.ry + Math.PI)*Math.min(1, dt*0.8);
}

function syncPresence(){
  if (!entered) return;
  const st = { x: r2(me.x), z: r2(me.z), l: me.l, r: r2(((me.ry % (Math.PI*2)) + Math.PI*2) % (Math.PI*2)), s: me.seat };
  const ch = {}; let any = false;
  for (const k in st) if (st[k] !== lastPub[k]) { ch[k] = st[k]; any = true; }
  if (any) { Object.assign(lastPub, st); pub(ch); }
}
const cleanName = s => (typeof s === 'string' ? s : '').replace(/[\u0000-\u001f\u007f-\u009f​-‏‪-‮⁠-⁤﻿]/g, '').trim().slice(0, 12) || '승객';
const cleanColor = (s, list) => (typeof s === 'string' && /^#[0-9a-f]{6}$/i.test(s)) ? s : list[0];
const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
function lookFrom(pr){ return { n: cleanName(pr.n), c: cleanColor(pr.c, SHIRTS), k: cleanColor(pr.k, SKINS), h: !!pr.h, g: pr.g === 'm' ? 'm' : 'f' }; }

function onPeers(peers){
  const seen = new Set();
  for (const p of peers) {
    if (p.sameTab) { myPeer = p.peer; continue; }
    if (p.kind !== 'viewer') continue;
    const pr = p.presence || {};
    if (typeof pr.n !== 'string') continue;
    seen.add(p.peer);
    let r = remotes.get(p.peer);
    const look = lookFrom(pr);
    if (!r) {
      r = { peer: p.peer, look, av: new Avatar(look, false), x: num(pr.x, 0), z: num(pr.z, 15), l: [0, 1, 2].includes(pr.l) ? pr.l : 0, ry: num(pr.r, 0), seat: -1, sayT: null, emoT: null, pres: null, guest: !!p.guest, mineOther: p.isMe };
      r.av.root.position.set(r.x, levelY(r.l, r.z), r.z);
      remotes.set(p.peer, r);
      if (entered) addLog({ sys: `${look.n}님이 승선했어요` });
    }
    if (r.pres === pr) continue;
    r.pres = pr;
    r.look = look; r.av.setLook(look);
    r.tx = clamp(num(pr.x, r.x), -16, 16); r.tz = clamp(num(pr.z, r.z), -50, 45); r.tr = num(pr.r, r.ry); r.l = [0, 1, 2].includes(pr.l) ? pr.l : 0;
    const s = Math.floor(num(pr.s, -1)); r.seat = (s >= 0 && s < LOUNGERS.length) ? s : -1;
    const say = pr.say;
    if (say && typeof say.m === 'string' && say.t !== r.sayT) {
      const fresh = r.sayT !== null || Math.abs(Date.now() - num(say.t, 0)) < 45000;
      r.sayT = say.t;
      const m = say.m.replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, 80);
      if (fresh && m) { r.av.say(m); addLog({ name: look.n, color: look.c, text: m }); }
    }
    const emo = pr.emo;
    if (emo && typeof emo.e === 'string' && emo.t !== r.emoT) {
      const fresh = r.emoT !== null || Math.abs(Date.now() - num(emo.t, 0)) < 8000;
      r.emoT = emo.t;
      if (fresh) r.av.emote(emo.e);
    }
  }
  for (const [k, r] of remotes) if (!seen.has(k)) { r.av.dispose(); remotes.delete(k); if (entered) addLog({ sys: `${r.look.n}님이 하선했어요` }); }
  // seat conflict: lower peer label keeps the seat
  if (me.seat >= 0 && myPeer) for (const r of remotes.values()) if (r.seat === me.seat && r.peer < myPeer) { standUp(); toast('다른 분과 동시에 누워서 자리를 양보했어요'); break; }
  renderCrew(); updateEntryStatus();
}
function updateRemotes(dt){
  const k = 1 - Math.exp(-dt*8);
  for (const r of remotes.values()) {
    let x, z, ry, y;
    if (r.seat >= 0) { const p = seatPose(r.seat); x = p.x; z = p.z; ry = p.ry; r.x = x; r.z = z; r.ry = ry; y = levelY(p.l); }
    else {
      const ox = r.x, oz = r.z;
      r.x = lerp(r.x, r.tx ?? r.x, k); r.z = lerp(r.z, r.tz ?? r.z, k);
      r.ry = r.ry + angDiff(r.ry, r.tr ?? r.ry)*k;
      r.av.speed = lerp(r.av.speed, Math.hypot(r.x - ox, r.z - oz)/Math.max(dt, 1e-3), 0.25);
      x = r.x; z = r.z; ry = r.ry;
      // a passenger seen jumping between decks snaps instead of sliding through the salon
      if (r.l !== r.shownL) { if (r.shownL !== undefined && r.l !== 2 && r.shownL !== 2) { r.x = x = r.tx ?? x; r.z = z = r.tz ?? z; } r.shownL = r.l; }
      y = levelY(r.l, z);
    }
    r.av.root.position.set(x, y, z); r.av.root.rotation.y = ry;
  }
}

/* ================= Sound: generative piano + sea ================= */
// Each piano pitch is rendered once, off the main thread (OfflineAudioContext), as three slightly
// detuned strings with stretched (inharmonic) overtones, a hammer-position spectrum, a two-stage
// decay and a soft felt thump. Notes then play from those buffers through a stereo hall reverb.
const Sound = (() => {
  let ctx = null, musicBus, wavesBus, noiseBuf, timer = 0, key = 62, alive = 0;
  let mv = 0.9, wv = 0.6;
  const SCALE = [0, 2, 4, 5, 7, 9, 11];
  const PROGS = [[3,0,5,4],[0,3,5,3],[5,3,0,4],[3,4,2,5],[0,5,3,4],[3,2,1,4],[0,2,3,0]];
  const dm = (deg, base) => base + 12*Math.floor(deg/7) + SCALE[((deg % 7) + 7) % 7];
  const hum = () => rand(-0.02, 0.028);
  const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const pending = new Map(), ready = new Map();

  function renderNote(midi){
    if (pending.has(midi)) return pending.get(midi);
    const job = (async () => {
      const sr = 44100;
      const f0 = 440*Math.pow(2, (midi - 69)/12);
      const dur = clamp(3.2 + (72 - midi)*0.08, 2.2, 7);
      const oc = new OAC(2, Math.ceil(sr*dur), sr);
      const out = oc.createGain(); out.connect(oc.destination);
      const B = 0.00007*Math.pow(2, (midi - 48)/13);             // string stiffness -> stretched partials
      const tau = clamp(3.6*Math.pow(2, (50 - midi)/20), 0.7, 7);  // decay time of the fundamental
      const strings = midi < 38 ? 2 : 3;
      for (let s = 0; s < strings; s++) {
        const off = s - (strings - 1)/2;
        const sg = oc.createGain(); sg.gain.value = 1/strings;
        if (oc.createStereoPanner) { const p = oc.createStereoPanner(); p.pan.value = off*0.3; sg.connect(p); p.connect(out); }
        else sg.connect(out);
        const det = Math.pow(2, (off*0.9 + rand(-0.15, 0.15))/1200);
        for (let n = 1; n <= 28; n++) {
          const fn = n*f0*Math.sqrt(1 + B*n*n)*det;
          if (fn > 13000) break;
          let a = Math.pow(n, -1.2)*(Math.abs(Math.sin(Math.PI*n/8.5)) + 0.06);
          if (midi > 76) a *= Math.exp(-(n - 1)*0.25);
          const tn = tau/(1 + 0.42*(n - 1) + 0.00035*fn);
          const o = oc.createOscillator(); o.frequency.value = fn;
          const g = oc.createGain();
          const ph = rand(0, 0.002);
          g.gain.setValueAtTime(0, 0);
          g.gain.linearRampToValueAtTime(a, 0.003 + ph);
          g.gain.setTargetAtTime(a*0.32, 0.004 + ph, tn*0.16);      // prompt sound
          g.gain.setTargetAtTime(0, 0.004 + tn*0.55, tn*0.85);     // long aftersound
          o.connect(g); g.connect(sg); o.start(0); o.stop(dur);
        }
      }
      // felt hammer thump
      const nb = oc.createBuffer(1, Math.floor(sr*0.05), sr), d = nb.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1)*Math.exp(-i/(sr*0.005));
      const ns = oc.createBufferSource(); ns.buffer = nb;
      const bp = oc.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = Math.min(3500, f0*5); bp.Q.value = 0.9;
      const ng = oc.createGain(); ng.gain.value = 0.06;
      ns.connect(bp); bp.connect(ng); ng.connect(out); ns.start(0);
      const buf = await new Promise((res, rej) => {
        oc.oncomplete = e => res(e.renderedBuffer);
        const r = oc.startRendering(); if (r && r.then) r.then(res, rej);
      });
      // normalise, with a little extra weight in the bass so low notes don't sound thin
      let peak = 0;
      for (let c = 0; c < buf.numberOfChannels; c++) { const ch = buf.getChannelData(c); for (let i = 0; i < ch.length; i += 3) { const v = Math.abs(ch[i]); if (v > peak) peak = v; } }
      const k = (peak > 0 ? 0.85/peak : 1)*(midi < 52 ? 1.12 : 1);
      const fade = Math.floor(sr*0.08);
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const ch = buf.getChannelData(c);
        for (let i = 0; i < ch.length; i++) ch[i] *= k;
        for (let i = 0; i < fade; i++) ch[ch.length - 1 - i] *= i/fade;
      }
      ready.set(midi, buf);
      return buf;
    })();
    pending.set(midi, job);
    return job;
  }

  function play(t, midi, vel, len){
    const buf = ready.get(midi); if (!buf) return;
    const g = clamp(vel*8.5, 0.05, 1);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.35;
    lp.frequency.value = 1400 + 10000*g*g;                          // softer touch = darker tone
    const env = ctx.createGain();
    env.gain.setValueAtTime(g*g*0.85 + g*0.15, t);
    const rel = t + Math.max(0.35, len);
    env.gain.setTargetAtTime(0, rel, 0.4);                           // damper
    src.connect(lp); lp.connect(env);
    if (ctx.createStereoPanner) { const p = ctx.createStereoPanner(); p.pan.value = clamp((midi - 62)/30, -0.6, 0.6); env.connect(p); p.connect(musicBus); }
    else env.connect(musicBus);
    src.start(t); src.stop(Math.min(t + buf.duration, rel + 2.5));
  }

  function nearestChordTone(m, chord){
    let best = m, bd = 99;
    for (const c of chord) for (let o = -1; o <= 3; o++) { const v = c + 7*o; const d = Math.abs(v - m); if (d < bd) { bd = d; best = v; } }
    return best;
  }
  // compose a phrase as a list of notes (times relative to its start)
  function compose(){
    if (Math.random() < 0.4) key = pick([60, 62, 65, 57, 64]);
    const ev = [], note = (t, m, v, l) => ev.push([t, m, v, l]);
    const prog = pick(PROGS), reps = 2 + (Math.random() < 0.35 ? 1 : 0);
    const beat = 60/rand(62, 72), bar = beat*4, bars = prog.length*reps;
    let t = 0, mel = pick([9, 11, 7]);
    for (let b = 0; b < bars; b++) {
      const root = prog[b % prog.length], chord = [root, root+2, root+4, root+6], last = b === bars - 1;
      note(t + hum(), dm(root, key - 24), 0.068, bar*1.8);
      if (Math.random() < 0.7) note(t + beat + hum(), dm(root + 4, key - 24), 0.045, bar*1.3);
      const arp = [root+2, root+4, root+6, root+7];
      for (let s = 2; s < 8; s++) if (Math.random() < 0.34) note(t + s*beat*0.5 + hum(), dm(pick(arp), key - 12), 0.04, beat*3.4);
      if (!last && Math.random() > 0.22) {
        for (let s = 0; s < 8; s++) {
          const strong = s % 2 === 0;
          if (Math.random() < (strong ? 0.4 : 0.13)) {
            mel = clamp(mel + pick([-2,-1,-1,0,1,1,2]), 6, 15);
            if (strong && Math.random() < 0.6) mel = clamp(nearestChordTone(mel, chord), 6, 15);
            const v = rand(0.07, 0.095);
            note(t + s*beat*0.5 + hum(), dm(mel, key - 12), v, beat*4.8);
            if (Math.random() < 0.12) note(t + s*beat*0.5 + hum(), dm(mel - 2, key - 12), v*0.55, beat*4);
            else if (Math.random() < 0.08) note(t + s*beat*0.5 + 0.004, dm(mel + 7, key - 12), v*0.4, beat*4);
          }
        }
      }
      if (last) chord.forEach((d, i) => note(t + i*0.12, dm(d + (i > 1 ? 7 : 0), key - 12), 0.055, bar*2.8));
      t += bar;
    }
    return { ev, length: t };
  }
  async function phrase(){
    const my = alive;
    const { ev, length } = compose();
    if (OAC) await Promise.all([...new Set(ev.map(e => e[1]))].map(m => renderNote(m).catch(() => null)));
    if (my !== alive || !ctx) return;
    const base = ctx.currentTime + 0.25;
    for (const [t, m, v, l] of ev) play(base + Math.max(0, t), m, v, l);
    const next = base + length + rand(9, 22);
    clearTimeout(timer);
    timer = setTimeout(phrase, Math.max(500, (next - ctx.currentTime - 1.5)*1000));
  }
  // warm the cache for the usual range, one note at a time so nothing stutters
  async function prewarm(){
    if (!OAC) return;
    for (let m = 36; m <= 84; m++) { try { await renderNote(m); } catch (e) {} await new Promise(r => setTimeout(r, 30)); }
  }

  function hallImpulse(sec){
    const sr = ctx.sampleRate, len = Math.floor(sr*sec), b = ctx.createBuffer(2, len, sr), pre = Math.floor(sr*0.022);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch); let lp = 0;
      for (let i = pre; i < len; i++) {
        const t = (i - pre)/sr, x = (i - pre)/(len - pre);
        const env = Math.pow(1 - x, 2.0)*Math.exp(-t*0.9);
        const damp = 0.15 + 0.8*x;                                   // the tail gets darker as it fades
        lp += ((Math.random()*2 - 1) - lp)*(1 - damp*0.9);
        d[i] = lp*env;
      }
      for (const e of [0.009, 0.014, 0.021, 0.029, 0.037, 0.048, 0.061]) {
        const i = pre + Math.floor((e + (ch ? 0.0031 : 0))*sr); if (i < len) d[i] += (Math.random() < 0.5 ? -1 : 1)*rand(0.3, 0.6);
      }
    }
    return b;
  }
  function startWaves(){
    const len = ctx.sampleRate*6; noiseBuf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = noiseBuf.getChannelData(ch); let last = 0; for (let i = 0; i < len; i++) { last = (last + 0.02*(Math.random()*2 - 1))/1.02; d[i] = last*3.5; } }
    const layer = (rate, type, freq, q, base, lfoF, depth) => {
      const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.playbackRate.value = rate;
      const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
      const g = ctx.createGain(); g.gain.value = base;
      const l = ctx.createOscillator(); l.frequency.value = lfoF; const lg = ctx.createGain(); lg.gain.value = depth;
      l.connect(lg); lg.connect(g.gain);
      s.connect(f); f.connect(g); g.connect(wavesBus); s.start(); l.start();
    };
    layer(1, 'lowpass', 480, 0.4, 0.42, 0.07, 0.26);
    layer(1.6, 'bandpass', 1300, 0.6, 0.045, 0.11, 0.035);
    lap();
  }
  function lap(){
    if (!ctx) return;
    const t = ctx.currentTime + 0.05;
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rand(280, 700); f.Q.value = 1.1;
    const g = ctx.createGain(); const peak = rand(0.14, 0.3), dur = rand(0.6, 1.2);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.09); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(wavesBus); s.start(t, rand(0, 4), dur + 0.1);
    setTimeout(lap, rand(1800, 5200));
  }
  return {
    start(){
      if (ctx) { ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      ctx = new AC();
      // mix bus -> gentle glue compression -> make-up gain -> brick-wall limiter
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -2.5; limiter.knee.value = 0; limiter.ratio.value = 20; limiter.attack.value = 0.002; limiter.release.value = 0.15;
      limiter.connect(ctx.destination);
      const makeup = ctx.createGain(); makeup.gain.value = 1.9; makeup.connect(limiter);
      const glue = ctx.createDynamicsCompressor();
      glue.threshold.value = -20; glue.knee.value = 12; glue.ratio.value = 2.5; glue.attack.value = 0.02; glue.release.value = 0.35;
      glue.connect(makeup);
      const master = ctx.createGain(); master.gain.value = 1.0; master.connect(glue);
      const rev = ctx.createConvolver(); rev.buffer = hallImpulse(4.2);
      const revG = ctx.createGain(); revG.gain.value = 0.7; rev.connect(revG); revG.connect(master);
      musicBus = ctx.createGain(); musicBus.gain.value = mv;
      const warm = ctx.createBiquadFilter(); warm.type = 'highshelf'; warm.frequency.value = 6500; warm.gain.value = -3;
      const body = ctx.createBiquadFilter(); body.type = 'peaking'; body.frequency.value = 220; body.Q.value = 0.8; body.gain.value = 1.5;
      musicBus.connect(body); body.connect(warm);
      const dry = ctx.createGain(); dry.gain.value = 0.8; warm.connect(dry); dry.connect(master);
      const send = ctx.createGain(); send.gain.value = 0.5; warm.connect(send); send.connect(rev);
      wavesBus = ctx.createGain(); wavesBus.gain.value = wv; wavesBus.connect(master);
      const ws = ctx.createGain(); ws.gain.value = 0.1; wavesBus.connect(ws); ws.connect(rev);
      startWaves();
      alive++;
      if (OAC) prewarm();
      setTimeout(phrase, 600);
      document.addEventListener('visibilitychange', () => { if (!document.hidden && ctx.state !== 'running') ctx.resume(); });
    },
    setVolumes(m, w){
      mv = m; wv = w;
      if (!ctx) return;
      musicBus.gain.setTargetAtTime(m, ctx.currentTime, 0.15);
      wavesBus.gain.setTargetAtTime(w, ctx.currentTime, 0.15);
    }
  };
})();

/* ================= Room connection ================= */
function setRoomState(s){ roomState = s; renderCrew(); updateEntryStatus(); }
// Public relay: anyone who opens the page joins, no login. Each passenger keeps one retained
// message (their whole state) on a public MQTT broker; a last-will message clears it when they leave.
function startRelay(){
  if (!window.mqtt || typeof window.mqtt.connect !== 'function') { setRoomState('solo'); return; }
  const id = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  myPeer = id;
  const BASE = 'pyeongan-lounge-8f3c1/v1/p/';
  const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt'];
  const peers = new Map();
  const dec = new TextDecoder();
  let client = null, bi = 0, lastSend = 0, pending = false, emitQueued = false;
  function emitPeers(){
    if (emitQueued) return; emitQueued = true;
    setTimeout(() => {
      emitQueued = false;
      const list = [...peers.entries()].sort((a, b) => a[1].first - b[1].first).slice(0, 26);
      const arr = list.map(([pid, v]) => ({ peer: pid, presence: v.presence, kind: 'viewer', sameTab: false, isMe: false, guest: false }));
      arr.push({ peer: id, presence: {}, kind: 'viewer', sameTab: true, isMe: true, guest: false });
      onPeers(arr);
    }, 30);
  }
  function send(force){
    if (!client || !client.connected || !entered) { pending = true; return; }
    const now = Date.now();
    if (!force && now - lastSend < 110) { pending = true; return; }
    lastSend = now; pending = false;
    client.publish(BASE + id, JSON.stringify(Object.assign({}, myState, { ts: now })), { qos: 0, retain: true });
  }
  function connect(){
    const url = BROKERS[bi % BROKERS.length];
    let opened = false;
    client = window.mqtt.connect(url, {
      clientId: 'pa_' + id + '_' + bi, clean: true, keepalive: 30, reconnectPeriod: 4000, connectTimeout: 8000,
      will: { topic: BASE + id, payload: '', qos: 0, retain: true }
    });
    const failTimer = setTimeout(() => {
      if (opened) return;
      try { client.end(true); } catch (e) {}
      bi++; if (bi >= 2 && roomState === 'wait') setRoomState('solo');
      connect();
    }, 10000);
    client.on('connect', () => {
      opened = true; clearTimeout(failTimer);
      setRoomState('on');
      client.subscribe(BASE + '+', { qos: 0 });
      if (entered) send(true);
    });
    client.on('offline', () => { if (opened) setRoomState('off'); });
    client.on('error', () => {});
    client.on('message', (topic, payload) => {
      const pid = topic.slice(BASE.length);
      if (!pid || pid === id || pid.length > 40) return;
      if (!payload || payload.length === 0) { if (peers.delete(pid)) emitPeers(); return; }
      if (payload.length > 4096) return;
      let o; try { o = JSON.parse(dec.decode(payload)); } catch (e) { return; }
      if (!o || typeof o !== 'object' || Array.isArray(o)) return;
      if (Math.abs(Date.now() - num(o.ts, 0)) > 60000) return;
      const prev = peers.get(pid);
      peers.set(pid, { presence: o, seen: Date.now(), first: prev ? prev.first : Date.now() });
      emitPeers();
    });
  }
  setInterval(() => { if (pending) send(); }, 120);
  setInterval(() => {
    send(true);
    const now = Date.now(); let ch = false;
    for (const [pid, v] of peers) if (now - v.seen > 16000) { peers.delete(pid); ch = true; }
    if (ch) emitPeers();
  }, 5000);
  window.addEventListener('pagehide', () => {
    try { if (client && client.connected && entered) { client.publish(BASE + id, '', { qos: 0, retain: true }); client.end(); } } catch (e) {}
  });
  relay = { send: () => send(false) };
  connect();
}
(async () => {
  const api = window.claude;
  if (api && typeof api.use === 'function') {
    try { room = await api.use('room'); } catch (e) { room = null; }
  }
  if (!room) { startRelay(); return; }
  publishFull();
  let offTimer = 0;
  room.onConnection(c => {
    clearTimeout(offTimer);
    if (c) setRoomState('on');
    else offTimer = setTimeout(() => setRoomState('off'), 2000);
  }, () => setRoomState('solo'));
  room.onPeers(ch => onPeers(ch.peers), () => setRoomState('solo'));
})();

/* ================= Environment update ================= */
const tmpC = new THREE.Color();
function updateEnv(dt){
  const k = 1 - Math.exp(-dt*1.4);
  env.sun.lerp(envTarget.sun, k).normalize();
  for (const key of COLOR_KEYS) env[key].lerp(envTarget[key], k);
  for (const key of NUM_KEYS) env[key] = lerp(env[key], envTarget[key], k);
  U.sunDir.value.copy(env.sun); U.topC.value.copy(env.top); U.horC.value.copy(env.hor); U.horC2.value.copy(env.hor2);
  U.sunC.value.copy(env.sunC); U.deepC.value.copy(env.deep); U.shalC.value.copy(env.shal);
  U.disc.value = env.disc; U.glow.value = env.glow; U.sunI.value = env.sunI;
  sunLight.color.copy(env.sunC).convertSRGBToLinear(); sunLight.intensity = env.light;
  hemi.color.copy(env.hemiS).convertSRGBToLinear(); hemi.groundColor.copy(env.hemiG).convertSRGBToLinear(); hemi.intensity = env.hemiI;
  scene.fog.color.copy(env.hor).lerp(env.hor2, 0.35).convertSRGBToLinear();
  stars.material.opacity = env.stars;
  for (const L of lampLights) L.intensity = env.lamps*1.25;
  M.bulb.color.set('#d8d2c4').lerp(tmpC.set('#ffcf86'), env.lamps);
  for (const b of bulbs) if (b.material !== M.bulb) b.material.color.copy(M.bulb.color);
  for (const g of glowMats) g.m.color.copy(g.day).lerp(g.night, env.lamps);
  windowM.emissiveIntensity = env.lamps*0.5;
  const tw = 0.85 + Math.sin(U.time.value*1.3)*0.06;
  for (const h of haloMats) h.opacity = env.lamps*tw*0.6;
  sternGlow.material.opacity = env.lamps*0.55;
  for (const c of clouds) { c.material.color.copy(env.cloud); c.material.opacity = env.cloudO; }
  gulls.mat.color.copy(env.gull);
}

/* ================= Main loop ================= */
function resize(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

let last = performance.now(), T = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last)/1000); last = now; T += dt;
  U.time.value = T;
  // gentle bobbing at anchor
  yacht.position.y = Math.sin(T*0.55)*0.06 + Math.sin(T*1.13 + 1)*0.02;
  yacht.rotation.z = Math.sin(T*0.45)*0.008 + Math.sin(T*0.83)*0.003;
  yacht.rotation.x = Math.sin(T*0.33 + 1)*0.004;
  for (const b of jacuzzi.bubbles) { const u = (T*0.5 + b.userData.ph) % 1; b.position.y = 0.565 + u*0.06; b.material.opacity = 0.7; b.scale.setScalar(1 - u*0.6); }
  jacuzzi.water.material.emissiveIntensity = 0.15 + env.lamps*0.6;
  yacht.updateMatrixWorld();
  for (const p of parasols) p.top.rotation.z = Math.sin(T*0.9 + p.g.userData.phase)*0.018;
  updateEnv(dt);
  if (entered) { updateMe(dt); syncPresence(); }
  updateRemotes(dt);
  if (myAvatar) { myAvatar.pose(dt, T, me.seat >= 0); myAvatar.label.visible = me.seat < 0 || cam.dist > 5; }
  for (const r of remotes.values()) r.av.pose(dt, T, r.seat >= 0);
  marker.material.opacity = Math.max(0, marker.material.opacity - dt*0.9);
  marker.scale.setScalar(1 + (0.9 - marker.material.opacity)*0.6);
  updateCamera(dt);
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  yacht.worldToLocal(camLocal.copy(camera.position));
  for (const o of festoonBulbs) o.visible = o.position.distanceToSquared(camLocal) > 3.2;
  ocean.position.set(Math.round(camera.position.x/4)*4, 0, Math.round(camera.position.z/4)*4);
  sunLight.position.copy(env.sun).multiplyScalar(140);
  for (const c of clouds) { c.position.x += c.userData.speed*dt; if (c.position.x > 900) c.position.x = -900; }
  sailboat.position.x -= dt*1.6; if (sailboat.position.x < -700) sailboat.position.x = 700;
  sailboat.position.y = Math.sin(T*0.8)*0.2;
  const beacon = scenery.userData.island.userData.beacon; beacon.visible = env.lamps > 0.3 && Math.sin(T*1.6) > 0.2;
  for (const g of gulls) {
    const u = g.userData, a = u.ph + T*u.sp;
    g.position.set(u.cx + Math.cos(a)*u.r, u.h + Math.sin(T*0.4 + u.ph)*2, u.cz + Math.sin(a)*u.r);
    g.rotation.y = -a + (u.sp > 0 ? 0 : Math.PI); g.rotation.z = (u.sp > 0 ? -0.25 : 0.25);
    const f = Math.sin(T*5 + u.ph)*0.5; u.L.rotation.z = f; u.R.rotation.z = -f;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { transomTex.image && redrawTransom(); });
function redrawTransom(){
  const c = transomTex.image, g = c.getContext('2d'), w = c.width, h = c.height;
  g.fillStyle = '#f3f2ee'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#1c2b4a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = '700 70px "Gowun Batang", serif'; g.fillText('평 안 호', w/2, h*0.42);
  g.font = '28px "Gowun Dodum", sans-serif'; g.fillText('P Y E O N G A N', w/2, h*0.82);
  transomTex.needsUpdate = true;
}
})();
